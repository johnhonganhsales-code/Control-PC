<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Máy của Tiến</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#e9eef1;--ink:#16252e;--mut:#5d6f79;--line:#cbd6dc;--card:#fff;--ok:#1b7f4b;--down:#c4302b;--warn:#b86a00;--idle:#6b7a83}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.25rem;margin:4px 0 2px}.sum{color:var(--mut);margin:0 0 14px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin:0 0 8px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--idle);border-radius:6px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.row:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #1d6fa5;outline-offset:2px}
.row.up{border-left-color:var(--ok)}.row.down{border-left-color:var(--down)}.row.grace{border-left-color:var(--warn)}
.nm{flex:1;font-weight:600}.st{font-weight:700;font-size:.9rem}.up .st{color:var(--ok)}.down .st{color:var(--down)}.grace .st{color:var(--warn)}
.ago{color:var(--mut);font-size:.85rem;min-width:84px;text-align:right}
#login,#err{text-align:center;margin:40px 0}#err{color:var(--down);margin:8px 0}
dialog{width:min(520px,94vw);border:1px solid var(--line);border-radius:8px;padding:18px}dialog::backdrop{background:#0006}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0}dt{color:var(--mut)}dd{margin:0}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}label{display:block;margin-top:10px;color:var(--mut);font-size:.9rem}
select,button.b{font:inherit;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:#fff}select{width:100%}
button.b{cursor:pointer;font-weight:600;background:#16252e;color:#fff;border-color:#16252e}button.b.o{background:#fff;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#16252e;color:#fff;padding:10px 16px;border-radius:6px;display:none;max-width:90vw}
</style></head><body><main>
<div id="login" hidden><h1>Máy của Tiến</h1><p>Đăng nhập bằng tài khoản Google đã được cấp quyền.</p><div id="gbtn" style="display:inline-block"></div></div>
<div id="app" hidden>
<h1>Máy của Tiến</h1><p class="sum" id="sum">Đang tải…</p><div id="err"></div><div id="list"></div>
<div class="act"><button class="b o" id="re">Làm mới</button><button class="b o" id="out">Đăng xuất</button></div></div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div></main>
<script>
const API='https://DIEN-URL-WORKER.workers.dev', CLIENT_ID='XXXX.apps.googleusercontent.com';
const MODES=['1 - Login','2 - Treo GP','3 - Treo Zombie','4 - Farm lum tre','5 - Goi boss / Bu boss','6 - Treo rank 1-1','7 - Rao ban do','8 - Friend Pass','9 - Bu nuoc RZ2'];
const TXT={up:'Đang mở',down:'Tắt',grace:'Sắp tắt',new:'Chưa ping',paused:'Tạm dừng'},SEV={down:0,grace:1,up:2,new:3,paused:4};
const $=id=>document.getElementById(id);let checks=[],cfg={accounts:[],vms:[]},timer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',4000)}
function ago(s){if(!s)return'chưa có';const m=Math.round((Date.now()-new Date(s))/6e4);return m<1?'vừa xong':m<60?m+' phút trước':m<1440?Math.floor(m/60)+' giờ trước':Math.floor(m/1440)+' ngày trước'}
function dur(s){return s%3600==0?s/3600+' giờ':s%60==0?s/60+' phút':s+' giây'}
function when(s){return s?new Date(s).toLocaleString('vi-VN'):'—'}
async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{authorization:'Bearer '+localStorage.idt,'content-type':'application/json'}});
 if(r.status==401){logout(false);throw Error('Hết phiên đăng nhập')}const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function logout(manual){localStorage.removeItem('idt');clearInterval(timer);$('app').hidden=true;$('login').hidden=false;if(manual)google.accounts.id.disableAutoSelect()}
async function load(){try{$('err').textContent='';checks=(await api('/checks')).checks;
 checks.sort((a,b)=>(SEV[a.status]??5)-(SEV[b.status]??5)||a.name.localeCompare(b.name));
 $('sum').textContent='Đang mở: '+checks.filter(c=>c.status=='up').length+' / '+checks.length+' máy';
 $('list').innerHTML=checks.map((c,i)=>`<button class="row ${c.status}" data-i="${i}"><span class="nm">${esc(c.name)}</span><span class="st">${TXT[c.status]||esc(c.status)}</span><span class="ago">${ago(c.last_ping)}</span></button>`).join('')}
 catch(e){$('err').textContent=e.message}}
async function start(){$('login').hidden=true;$('app').hidden=false;try{cfg=await api('/config')}catch(e){return}await load();clearInterval(timer);timer=setInterval(load,6e4)}
async function send(body,ok){try{await api('/command',{method:'POST',body:JSON.stringify(body)});toast(ok+' Máy nhận lệnh trong khoảng 15 giây.')}catch(e){toast('Gửi lệnh lỗi: '+e.message)}}
function detail(i){const c=checks[i],n=c.name.toLowerCase(),vm=cfg.vms.includes(n),k=s=>'vm_'+s+'_'+n;
 const sm=+localStorage.getItem(k('mode'))||9-1+1,sa=+localStorage.getItem(k('acc'))||0;
 $('dlg').innerHTML=`<h2 style="margin:0">${esc(c.name)} — ${TXT[c.status]||esc(c.status)}</h2><dl>
 <dt>Ping cuối</dt><dd>${when(c.last_ping)} (${ago(c.last_ping)})</dd><dt>Ping tới</dt><dd>${when(c.next_ping)}</dd>
 <dt>Số lần ping</dt><dd>${c.n_pings}</dd><dt>Timeout</dt><dd>${dur(c.timeout)}</dd><dt>Grace</dt><dd>${dur(c.grace)}</dd></dl>
 ${vm?`<label>Chế độ bot chạy<select id="sm">${MODES.map((m,j)=>`<option value="${j+1}" ${j+1==sm?'selected':''}>${m}</option>`).join('')}</select></label>
 <label>Tài khoản<select id="sa">${cfg.accounts.map((a,j)=>`<option ${j==sa?'selected':''}>${esc(a)}</option>`).join('')}</select></label>`:''}
 <div class="act"><button class="b o" id="bc">Chụp màn hình</button>${vm?'<button class="b" id="bm">Mở máy ảo</button><button class="b o" id="bp">Tạm ngưng</button><button class="b o" id="br">Tiếp tục</button>':''}<button class="b o" id="bx">Đóng</button></div>`;
 $('bc').onclick=()=>send({cmd:'chup',machine:n},'Đã gửi lệnh chụp màn hình.');$('bx').onclick=()=>$('dlg').close();
 if(vm){$('bm').onclick=()=>{const m=$('sm').value,a=$('sa').value;localStorage.setItem(k('mode'),m);localStorage.setItem(k('acc'),$('sa').selectedIndex);send({cmd:'mo',machine:n,mode:+m,acc:a},'Đã gửi lệnh mở máy ảo.')};
  $('bp').onclick=()=>send({cmd:'tamngung',machine:n},'Đã gửi lệnh tạm ngưng '+n+'.');$('br').onclick=()=>send({cmd:'tieptuc',machine:n},'Đã gửi lệnh tiếp tục '+n+'.')}
 $('dlg').showModal()}
$('list').onclick=e=>{const b=e.target.closest('.row');if(b)detail(+b.dataset.i)};$('re').onclick=load;$('out').onclick=()=>logout(true);
window.onload=()=>{google.accounts.id.initialize({client_id:CLIENT_ID,auto_select:true,callback:r=>{localStorage.idt=r.credential;start()}});
 google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'large',text:'signin_with'});
 if(localStorage.idt)start();else $('login').hidden=false}
</script></body></html>
